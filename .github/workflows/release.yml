name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub Release with the binaries for
# Linux (amd64 and arm64) and their checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog reads the history since the previous tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Release notes from CHANGELOG.md
        id: notes
        # The section headed with this tag, if there is one; outside the checkout,
        # which goreleaser wants clean.
        run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## / { take = ($2 == tag); next } take' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
